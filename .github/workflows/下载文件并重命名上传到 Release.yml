name: 下载文件并上传到 Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          JSON 对象，键为下载链接，值为上传后保存的文件名。
          示例：{"https://example.com/file.zip": "my-file.zip"}
        required: true
        type: string
      tag:
        description: '目标 Release 的 tag（如 v1.7），不存在则自动创建'
        required: true
        type: string
        default: 'v1.0'
      cookies:
        description: '可选：Cookie 字符串（从浏览器复制完整内容），若不需要可留空'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 并发下载并上传（最多 3 个并行）
        shell: bash
        env:
          URLS_JSON: ${{ github.event.inputs.urls }}
          TAG: ${{ github.event.inputs.tag }}
          COOKIES: ${{ github.event.inputs.cookies }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 清理 Windows 换行符，修复 JSON 末尾逗号
          export URLS_JSON="$(printf '%s' "$URLS_JSON" | tr -d '\r')"
          export URLS_JSON="$(printf '%s' "$URLS_JSON" | sed -Ez 's/,\s*(]|})/\1/g')"

          COUNT=$(jq -n 'env.URLS_JSON | fromjson | keys | length')
          echo "共有 ${COUNT} 个下载任务，最多 3 个并行"

          # 确保 release 存在
          if ! gh release view "${TAG}" &>/dev/null; then
            echo "创建 release: ${TAG}"
            gh release create "${TAG}" --title "${TAG}" --notes "自动下载上传"
          else
            echo "release ${TAG} 已存在，将上传文件"
          fi

          max_jobs=3
          running=0

          for ((idx=0; idx<COUNT; idx++)); do
            echo "========================================="
            echo ">>> 启动任务 $((idx+1))/${COUNT}"

            (
              set -euo pipefail
              tag="${TAG}"
              cookies="${COOKIES}"
              url=$(jq -rn --argjson i "$idx" 'env.URLS_JSON | fromjson | to_entries | .[$i].key')
              custom_name=$(jq -rn --argjson i "$idx" 'env.URLS_JSON | fromjson | to_entries | .[$i].value // ""')

              if [[ -z "$url" ]]; then
                echo "[任务 $idx] 错误：空链接，跳过"
                exit 0
              fi

              # 确定最终文件名
              if [[ -n "$custom_name" ]]; then
                filename="$(basename "$custom_name" | tr -d '\r')"
              else
                filename="$(basename "${url%%\?*}" || true)"
                if [[ -z "$filename" ]]; then
                  filename="download"
                fi
                filename="$(printf '%s' "$filename" | tr -d '\r')"
              fi
              echo "[任务 $idx] 文件名: $filename"

              # 自动提取 Referer
              referer="$(echo "$url" | awk -F/ '{printf "https://%s/", $3}')"
              echo "[任务 $idx] Referer: $referer"

              task_dir=$(mktemp -d -t "dl-${idx}-XXXXX")
              echo "[任务 $idx] 临时目录: $task_dir"
              cleanup() { echo "[任务 $idx] 清理 $task_dir"; rm -rf "$task_dir"; }
              trap cleanup EXIT

              cd "$task_dir"

              # 构建请求头数组
              headers=(
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
                -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
                -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8"
                -H "Accept-Encoding: identity"   # 不压缩，避免干扰文件格式
                -H "Connection: keep-alive"
                -H "DNT: 1"
                -H "Upgrade-Insecure-Requests: 1"
                -H "Referer: ${referer}"
              )

              # 如果提供了 Cookie，则追加
              if [[ -n "$cookies" ]]; then
                headers+=(-H "Cookie: ${cookies}")
                echo "[任务 $idx] 已附加 Cookie"
              fi

              # 下载（重试 3 次，每次失败后等待递增秒数）
              echo "[任务 $idx] 下载: $url"
              success=false
              for attempt in 1 2 3; do
                if curl -fsSL \
                  --retry 2 \
                  --max-time 1800 \
                  "${headers[@]}" \
                  -o "$filename" \
                  "$url"; then
                  echo "[任务 $idx] 下载成功"
                  success=true
                  break
                else
                  echo "[任务 $idx] 下载失败，重试 $attempt/3 ..."
                  sleep $((attempt * 5))
                fi
              done

              if [[ "$success" != true ]]; then
                echo "[任务 $idx] 下载最终失败，可能需提供有效 Cookie 或检查签名是否过期"
                exit 1
              fi

              # 上传到 Release
              echo "[任务 $idx] 上传到 release ${tag}..."
              gh release upload "${tag}" "$filename" --clobber

              echo "[任务 $idx] 任务完成"
            ) &  # 后台并发

            running=$((running + 1))
            if (( running >= max_jobs )); then
              wait -n
              running=$((running - 1))
            fi
          done

          wait
          echo "所有任务处理完毕"
